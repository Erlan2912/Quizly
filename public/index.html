<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><title>Quizly — Knowledge Arena</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">Q</div><div><b>QUIZLY</b><small>KNOWLEDGE ARENA</small></div></div>
    <button class="icon-btn" id="themeQuick" aria-label="Theme"><span id="themeIcon">☼</span></button>
  </header>
  <section id="authGate" class="auth-gate hidden"><div class="auth-card"><div class="brand-mark">Q</div><h1 id="authTitle">Welcome to Quizly</h1><p>Username va parol bilan davom eting.</p><form id="authForm"><label id="firstNameWrap" class="hidden">Ism<input id="authFirstName" maxlength="40" placeholder="Ismingiz"></label><label>Username<input id="authUsername" minlength="3" maxlength="20" required placeholder="your_username"></label><label>Password<input id="authPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="At least 8 characters"></label><label id="confirmWrap" class="hidden">Parolni tasdiqlang<input id="authPasswordConfirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Parolni qayta kiriting"></label><button class="primary auth-submit" id="authSubmit">Login</button></form><p id="authError" class="auth-error"></p><button id="authSwitch" class="auth-switch" type="button">Create account</button></div></section><main id="view" class="view hidden"></main>
  <nav class="dock" aria-label="Main navigation">
    <div class="dock-glider" id="glider"></div>
    <button class="nav-item active" data-page="home"><span class="nav-icon">⌂</span><small>Home</small></button>
    <button class="nav-item" data-page="quiz"><span class="nav-icon">◇</span><small>Quiz</small></button>
    <button class="nav-item" data-page="rank"><span class="nav-icon">♛</span><small>Rank</small></button>
    <button class="nav-item" data-page="profile"><span class="nav-icon">◎</span><small>Profile</small></button>
    <button class="nav-item" data-page="more"><span class="nav-icon">⚙</span><small>More</small></button>
  </nav>
  <div id="toast" class="toast"></div>
</div>
<script src="/app.js"></script>
</body></html>
